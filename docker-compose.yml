version: '3.8'

services:
  # ==========================================================================
  # Infrastructure Services
  # ==========================================================================

  postgres:
    image: postgres:15-alpine
    container_name: saiv-postgres
    environment:
      POSTGRES_USER: saiv
      POSTGRES_PASSWORD: saiv_password
      POSTGRES_DB: saiv
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saiv"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saiv-network

  redis:
    image: redis:7-alpine
    container_name: saiv-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saiv-network

  # ==========================================================================
  # Application Services (Students implement these)
  # ==========================================================================

  backend:
    build:
      context: ./module2-backend
      dockerfile: Dockerfile
    container_name: saiv-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://saiv:saiv_password@postgres:5432/saiv
      REDIS_URL: redis://redis:6379
      SECRET_KEY: your-secret-key-change-in-production
      FACE_SERVICE_URL: http://face-recognition:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./module2-backend/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    develop:
      watch:
        - action: rebuild
          path: ./module2-backend/requirements.txt
        - action: rebuild
          path: ./module2-backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saiv-network

  face-recognition:
    build:
      context: ./module3-face-recognition
      dockerfile: Dockerfile
    container_name: saiv-face-recognition
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./module3-face-recognition/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload", "--reload-dir", "/app/app"]
    develop:
      watch:
        - action: rebuild
          path: ./module3-face-recognition/requirements.txt
        - action: rebuild
          path: ./module3-face-recognition/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - saiv-network

  frontend:
    build:
      context: ./module1-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_SURFACE: student
        PORT: "3000"
    container_name: saiv-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_APP_SURFACE: student
      PORT: "3000"
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_FACE_SERVICE_URL: http://localhost:8001
      WATCHPACK_POLLING: "true"
    volumes:
      - ./module1-frontend/app:/app/app
      - ./module1-frontend/components:/app/components
      - ./module1-frontend/lib:/app/lib
      - ./module1-frontend/public:/app/public
      - ./module1-frontend/next.config.js:/app/next.config.js
      - ./module1-frontend/postcss.config.js:/app/postcss.config.js
      - ./module1-frontend/tailwind.config.js:/app/tailwind.config.js
      - ./module1-frontend/tsconfig.json:/app/tsconfig.json
    command: ["npx", "next", "dev", "-p", "3000"]
    develop:
      watch:
        - action: rebuild
          path: ./module1-frontend/package.json
        - action: rebuild
          path: ./module1-frontend/package-lock.json
        - action: rebuild
          path: ./module1-frontend/Dockerfile
    depends_on:
      - backend
    networks:
      - saiv-network

  dashboard:
    build:
      context: ./module1-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_SURFACE: instructor
        PORT: "8501"
    container_name: saiv-dashboard
    ports:
      - "8501:8501"
    environment:
      NEXT_PUBLIC_APP_SURFACE: instructor
      PORT: "8501"
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./module1-frontend/app:/app/app
      - ./module1-frontend/components:/app/components
      - ./module1-frontend/lib:/app/lib
      - ./module1-frontend/public:/app/public
      - ./module1-frontend/next.config.js:/app/next.config.js
      - ./module1-frontend/postcss.config.js:/app/postcss.config.js
      - ./module1-frontend/tailwind.config.js:/app/tailwind.config.js
      - ./module1-frontend/tsconfig.json:/app/tsconfig.json
    command: ["npx", "next", "dev", "-p", "8501"]
    develop:
      watch:
        - action: rebuild
          path: ./module1-frontend/package.json
        - action: rebuild
          path: ./module1-frontend/package-lock.json
        - action: rebuild
          path: ./module1-frontend/Dockerfile
    depends_on:
      - backend
    networks:
      - saiv-network

  # ==========================================================================
  # Observability Services
  # ==========================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: saiv-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./module4-observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    develop:
      watch:
        - action: restart
          path: ./module4-observability/prometheus.yml
    networks:
      - saiv-network

  grafana:
    image: grafana/grafana:latest
    container_name: saiv-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./module4-observability/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    develop:
      watch:
        - action: restart
          path: ./module4-observability/grafana/provisioning
    networks:
      - saiv-network

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: saiv-otel-collector
    ports:
      - "4317:4317"   # gRPC
      - "4318:4318"   # HTTP
    volumes:
      - ./module4-observability/otel-collector-config.yml:/etc/otel/config.yaml
    command: ["--config=/etc/otel/config.yaml"]
    develop:
      watch:
        - action: restart
          path: ./module4-observability/otel-collector-config.yml
    networks:
      - saiv-network

  observability-ui:
    build:
      context: ./module4-observability
      dockerfile: Dockerfile
    container_name: saiv-observability-ui
    ports:
      - "8502:8501"
    volumes:
      - ./module4-observability/app:/app/app
    command: ["streamlit", "run", "app/main.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.runOnSave=true", "--server.fileWatcherType=poll"]
    develop:
      watch:
        - action: rebuild
          path: ./module4-observability/requirements.txt
        - action: rebuild
          path: ./module4-observability/Dockerfile
    networks:
      - saiv-network

networks:
  saiv-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
